  <rect x="5" y="14" width="22" height="10" rx="1.5" fill="#16202b" stroke="#d75f38" stroke-width="1.3"/>

  <path d="M3 24 L29 24 L26 29 L6 29 Z" fill="#d75f38"/>
  <rect x="14" y="25.6" width="4" height="1.3" rx="0.6" fill="#16202b" opacity="0.5"/>

  <rect class="hand handL" x="9.5" y="21.8" width="4" height="2.6" rx="1.2" fill="#f4ece4"/>
  <rect class="hand handR" x="18.5" y="21.8" width="4" height="2.6" rx="1.2" fill="#f4ece4"/>
</svg>
